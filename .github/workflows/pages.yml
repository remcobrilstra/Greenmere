# Checks every push and pull request; deploys main to GitHub Pages once the checks pass.
# The site is the game's own files, staged by tools/build.mjs (no compile step);
# shots/, tools/ and docs/ stay out of it.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish rather than cancel it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The in-page self-test (src/test/self-test.js) in headless Chromium on software WebGL.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Self-test
        run: npm test

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: pages
        uses: actions/configure-pages@v5

      # Stages _site/, fills in the site address and checks no shipped file is missing.
      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
