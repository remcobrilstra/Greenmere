# Deploys the game to GitHub Pages. No build step: the site is the static files
# the game loads at runtime (index.html, src/, assets/, icons/, manifest, sw.js),
# copied into _site so shots/, tools/ and docs/ stay out of the published site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icons assets src _site/
          touch _site/.nojekyll

      - id: pages
        uses: actions/configure-pages@v5

      # Social cards and the canonical link need absolute URLs: fill in %BASE_URL%
      # and write robots.txt and sitemap.xml for the address Pages serves from.
      - name: Fill in site URL
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          sed -i "s|%BASE_URL%|${BASE_URL}|g" _site/index.html
          if grep -q "%BASE_URL%" _site/index.html; then echo "unfilled %BASE_URL%"; exit 1; fi
          printf 'User-agent: *\nAllow: /\nSitemap: %s/sitemap.xml\n' "$BASE_URL" > _site/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>%s/</loc><lastmod>%s</lastmod></url>\n</urlset>\n' "$BASE_URL" "$(date -u +%Y-%m-%d)" > _site/sitemap.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
